<main class="category-page">
  <a class="back-link" routerLink="/home">
    <app-icon name="arrow-left" />
    <span>Back to home</span>
  </a>

  <app-section-header
    label="Category"
    title="{{ categoryTitle() }}"
    description="Browse our collection and gear up for your next build."
    fallback="Products"
  ></app-section-header>

  @if (state.isLoading()) {
    <div class="products-grid">
      @for (item of [0, 1, 2, 3, 4, 5, 6, 7]; track item) {
        <app-product-skeleton></app-product-skeleton>
      }
    </div>
  } @else if (state.error()) {
    <app-state-card state="error"></app-state-card>
  } @else if (state.isEmpty()) {
    <app-state-card state="empty"></app-state-card>
  } @else {
    <div class="products-grid">
      @for (product of state.data(); track product.id) {
        <app-product-card [product]="product" />
      }
    </div>
  }
</main>
