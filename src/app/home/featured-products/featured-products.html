<section class="home-section">
  <div class="featured-head">
    <app-section-header
      label="Hand Picked"
      title="Featured Products"
      description="The gear our community can't stop talking about."
      align="normal"
    >
    </app-section-header>
    <a class="view-all" routerLink="/products/pre-built-pcs">
      <span>View all</span>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke="currentColor"
        aria-hidden="true"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12l-7.5 7.5M21 12H3" />
      </svg>
    </a>
  </div>

  @if (isLoading()) {
    <div class="products-track">
      @for (item of [0, 1, 2, 3, 4]; track item) {
        <div class="product-track-item">
          <app-product-skeleton></app-product-skeleton>
        </div>
      }
    </div>
  } @else {
    <div class="products-track">
      @for (product of products(); track product.name) {
        <div class="product-track-item">
          <app-product-card [product]="product" />
        </div>
      }
    </div>
  }
</section>
