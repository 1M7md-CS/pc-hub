<section class="home-section">
  <div class="featured-head">
    <app-section-header
      label="Hand Picked"
      title="Featured Products"
      description="The gear our community can't stop talking about."
      align="normal"
    >
    </app-section-header>
    <a class="view-all" routerLink="/products/pre-built-pcs">
      <span>View all</span>
      <app-icon name="arrow-right"/>
    </a>
  </div>

  @if (state.isLoading()) {
    <div class="products-track">
      @for (item of [0, 1, 2, 3, 4]; track item) {
        <div class="product-track-item">
          <app-product-skeleton></app-product-skeleton>
        </div>
      }
    </div>
  } @else if (state.error()) {
    <app-state-card state="error"></app-state-card>
  } @else if (state.isEmpty()) {
    <app-state-card state="empty"></app-state-card>
  } @else {
    <div class="products-track">
      @for (product of state.data(); track product.category + '-' + product.id) {
        <div class="product-track-item">
          <app-product-card [product]="product" />
        </div>
      }
    </div>
  }
</section>
