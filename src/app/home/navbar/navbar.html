<nav>
  <a routerLink="/home" class="logo">
    <img src="images/nav/logo.webp" alt="PcHub" />
  </a>

  <ul [class.active]="isMenuOpen()">
    <li>
      <a routerLink="/home">Home</a>
    </li>
    <li>
      <a routerLink="/home" fragment="products">Products</a>
    </li>
    <li>
      <a routerLink="/about-us">About</a>
    </li>
    <li>
      <a href="#">Contacts</a>
    </li>
  </ul>

  <div class="nav-action">
    <a routerLink="/cart">
      <button class="cart">
        <app-icon name="cart" />
      </button>
    </a>

    <a routerLink="/login">
      <button class="login">
        <app-icon name="user" />
      </button>
    </a>

    <button (click)="toggleMenu()" class="nav-menu">
      @if (!isMenuOpen()) {
        <app-icon name="menu" />
      } @else {
        <app-icon name="close" />
      }
    </button>
  </div>
</nav>
