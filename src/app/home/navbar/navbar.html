<nav>
  <a routerLink="/home" class="logo">
    <img src="images/nav/logo.webp" alt="PcHub" />
  </a>

  <ul [class.active]="isMenuOpen()">
    <li>
      <a routerLink="/home">Home</a>
    </li>
    <li>
      <a routerLink="/home" fragment="products">Products</a>
    </li>
    <li>
      <a routerLink="/about-us">About</a>
    </li>
    <li>
      <a routerLink="/contacts">Contacts</a>
    </li>
  </ul>

  <div class="nav-action">
    <a routerLink="/cart" class="cart">
      <app-icon name="cart" />
      @if (cartCount() > 0) {
        <span class="cart-badge">{{ cartCount() }}</span>
      }
    </a>

    @if (isAuthenticated()) {
      @let u = user()!;
      <div class="user-menu">
        <button class="user-btn" (click)="toggleDropdown()">
          <span class="user-avatar" aria-hidden="true">{{ u.name.charAt(0) }}</span>
          <span class="user-name">{{ u.name }}</span>
          <app-icon name="chevron-down" class="chevron" [class.open]="isDropdownOpen()" />
        </button>
        <div class="user-dropdown" [class.active]="isDropdownOpen()">
          <div class="dropdown-header">
            <span class="dropdown-name">{{ u.name }}</span>
            <span class="dropdown-email">{{ u.email }}</span>
          </div>
          <div class="dropdown-divider"></div>
          <a routerLink="/cart" class="dropdown-item" (click)="closeDropdown()">
            <app-icon name="cart" />
            <span>Cart</span>
          </a>
          <button class="dropdown-item" (click)="logout()">
            <app-icon name="lock" />
            <span>Logout</span>
          </button>
        </div>
      </div>
    } @else {
      <a routerLink="/login" class="login">
        <app-icon name="user" />
      </a>
    }

    <button (click)="toggleMenu()" class="nav-menu" aria-label="Toggle menu">
      @if (!isMenuOpen()) {
        <app-icon name="menu" />
      } @else {
        <app-icon name="close" />
      }
    </button>
  </div>
</nav>
