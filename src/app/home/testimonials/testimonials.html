<section class="home-section">
  <app-section-header
    label="Community"
    title="What Our Customers Say"
    description="Thousands of happy builders and gamers trust PcHub."
  ></app-section-header>

  @if (isLoading()) {
    <div class="testimonials-grid">
      @for (item of [0, 1, 2]; track item) {
        <div class="testimonial-card">
          <app-skeleton width="6rem" />
          <app-skeleton />
          <app-skeleton width="80%" />

          <div class="skeleton-author">
            <app-skeleton height="2.5rem" width="2.5rem" radius="50%" />
            <div>
              <app-skeleton width="8rem" />
              <app-skeleton width="80%" [style]="{ 'margin-top': '0.4rem' }" />
            </div>
          </div>
        </div>
      }
    </div>
  } @else {
    <div class="testimonials-grid">
      @for (testimonial of testimonials(); track testimonial.name) {
        <figure class="testimonial-card">
          <div class="testimonial-stars">
            @for (star of stars; track star) {
              <app-icon name="star" fill="currentColor" />
            }
          </div>

          <blockquote>“{{ testimonial.quote }}”</blockquote>

          <figcaption>
            <span class="testimonial-avatar">{{ testimonial.initials }}</span>

            <div>
              <strong>{{ testimonial.name }}</strong>
              <p>{{ testimonial.role }}</p>
            </div>
          </figcaption>
        </figure>
      }
    </div>
  }
</section>
