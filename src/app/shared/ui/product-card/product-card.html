<div class="product-card">
  <div class="product-visual">
    @if (product().badge) {
      <span class="product-badge">{{ product().badge }}</span>
    }

    <app-icon [name]="product().iconName" />
  </div>

  <div class="product-info">
    <div class="product-meta">
      <span class="product-category">{{ product().category }}</span>
      <span class="product-rating">
        <app-icon name="star" fill="currentColor" />

        {{ product().rating }}
      </span>
    </div>

    <h3 class="product-name">{{ product().name }}</h3>

    <ul class="list-circle">
      @for (spec of product().specs.slice(0, 3); track spec) {
        <li>{{ spec }}</li>
      }
    </ul>

    <div class="product-buttom">
      <div class="product-price">
        @if (product().oldPrice) {
          <span class="product-old-price">${{ product().oldPrice }}</span>
        }
        <span class="product-current-price">${{ product().price }}</span>
      </div>

      <button class="product-add">
        <app-icon name="plus" />
        <span>Add to cart</span>
      </button>
    </div>
  </div>
</div>
