<div class="product-card">
  <div class="product-visual">
    @if (product().badge) {
      <span class="product-badge">{{ product().badge }}</span>
    }

    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      @for (path of iconPaths(); track path) {
        <path [attr.d]="path" />
      }
    </svg>
  </div>

  <div class="product-info">
    <div class="product-meta">
      <span class="product-category">{{ product().category }}</span>
      <span class="product-rating">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          aria-hidden="true"
        >
          <path
            d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5z"
          />
        </svg>

        {{ product().rating }}
      </span>
    </div>

    <h3 class="product-name">{{ product().name }}</h3>

    <ul class="product-specs">
      @for (spec of product().specs.slice(0, 3); track spec) {
        <li>{{ spec }}</li>
      }
    </ul>

    <div class="product-buttom">
      <div class="product-price">
        @if (product().oldPrice) {
          <span class="product-old-price">${{ product().oldPrice }}</span>
        }
        <span class="product-current-price">${{ product().price }}</span>
      </div>

      <button class="product-add">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        <span>Add to cart</span>
      </button>
    </div>
  </div>
</div>
