<div class="state-card">
  <div class="icon-box">
    @if (state() === 'error') {
      <app-icon name="alert" />
    } @else if (state() === 'empty') {
      <app-icon name="box" />
    }
  </div>

  @if (state() === 'error') {
    <h3>Something went wrong</h3>
    <p>We couldn't load the products. Please try again in a moment.</p>
  } @else if (state() === 'empty') {
    <h3>No products found</h3>
    <p>There are no products available in this category right now.</p>
  }
</div>
