<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  aria-hidden="true"
  stroke-linecap="round"
  stroke-linejoin="round"
  [attr.fill]="fill()"
  fill-rule="nonzero"
  stroke="currentColor"
  stroke-width="2"
  [style.width]="size()"
  [style.height]="size()"
>
  @for (path of iconPaths(); track path) {
    <path [attr.d]="path" />
  }
</svg>
